# Render Blueprint — deploys the OMS server (Next.js web app + Express API + Socket.IO + jobs)
# Render dashboard → New → Blueprint → select this repository.
# Values marked `sync: false` are secrets: Render asks for them on first deploy (copy from your .env).
services:
  - type: web
    name: oms
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Per-IP API calls per 15 min (the built-in production default of 100 is too low for the dashboard)
      - key: API_RATE_LIMIT_MAX
        value: "5000"
      # Public URL(s) allowed to call the API cross-origin — e.g. https://oms-five-peach.vercel.app
      - key: CLIENT_URL
        sync: false
      - key: DB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: REDIS_URL
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
